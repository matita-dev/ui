name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ui
      # Until @matita/icons 0.4.0 (wobble) is on npm, build it next to this repo so `file:../icons` resolves.
      - uses: actions/checkout@v7
        with:
          repository: matita-dev/icons
          path: icons
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: icons
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: npm test
        working-directory: ui
